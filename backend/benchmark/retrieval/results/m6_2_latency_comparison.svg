<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <style>
    .title { font-size:18px; font-weight:700; fill:#1e293b; }
    .subtitle { font-size:12px; fill:#64748b; }
    .grid { stroke:#e2e8f0; stroke-width:1; stroke-dasharray:4 4; }
    .axis { stroke:#94a3b8; stroke-width:1.5; }
    .tick-label { font-size:13px; fill:#1e293b; text-anchor:middle; font-weight:600; }
    .y-label { font-size:11px; fill:#64748b; text-anchor:end; }
    .val-label { font-size:10px; font-weight:600; text-anchor:middle; }
    .legend-text { font-size:12px; fill:#334155; font-weight:500; }
  </style>
  <text x="80" y="32" class="title">AgentStudio-RAG — Retrieval Latency Benchmark</text>
  <text x="80" y="48" class="subtitle">Comparison of Retrieval Latencies (Mean, P50, P95 in ms) across 60 Queries</text>
  <rect x="520" y="30" width="12" height="12" rx="3" fill="#0284c7"/>
  <text x="536" y="40" class="legend-text">Mean</text>
  <rect x="635" y="30" width="12" height="12" rx="3" fill="#10b981"/>
  <text x="651" y="40" class="legend-text">P50 (Median)</text>
  <rect x="750" y="30" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="766" y="40" class="legend-text">P95</text>
  <line x1="80" y1="390.0" x2="860" y2="390.0" class="grid"/>
  <text x="72" y="394.0" class="y-label">0 ms</text>
  <line x1="80" y1="324.0" x2="860" y2="324.0" class="grid"/>
  <text x="72" y="328.0" class="y-label">660 ms</text>
  <line x1="80" y1="258.0" x2="860" y2="258.0" class="grid"/>
  <text x="72" y="262.0" class="y-label">1320 ms</text>
  <line x1="80" y1="192.0" x2="860" y2="192.0" class="grid"/>
  <text x="72" y="196.0" class="y-label">1980 ms</text>
  <line x1="80" y1="126.0" x2="860" y2="126.0" class="grid"/>
  <text x="72" y="130.0" class="y-label">2640 ms</text>
  <line x1="80" y1="60.0" x2="860" y2="60.0" class="grid"/>
  <text x="72" y="64.0" class="y-label">3300 ms</text>
  <line x1="80" y1="390" x2="860" y2="390" class="axis"/>
  <text x="177.5" y="414" class="tick-label">Dense Only</text>
  <rect x="107.9" y="389.4" width="42.4" height="0.6" rx="2" fill="#0284c7"/>
  <rect x="154.3" y="389.4" width="42.4" height="0.6" rx="2" fill="#10b981"/>
  <rect x="200.7" y="389.2" width="42.4" height="0.8" rx="2" fill="#ef4444"/>
  <text x="372.5" y="414" class="tick-label">BM25 Only</text>
  <rect x="302.9" y="389.9" width="42.4" height="0.1" rx="2" fill="#0284c7"/>
  <rect x="349.3" y="389.9" width="42.4" height="0.1" rx="2" fill="#10b981"/>
  <rect x="395.7" y="389.7" width="42.4" height="0.3" rx="2" fill="#ef4444"/>
  <text x="567.5" y="414" class="tick-label">Hybrid RRF</text>
  <rect x="497.9" y="389.3" width="42.4" height="0.7" rx="2" fill="#0284c7"/>
  <rect x="544.3" y="389.3" width="42.4" height="0.7" rx="2" fill="#10b981"/>
  <rect x="590.7" y="389.0" width="42.4" height="1.0" rx="2" fill="#ef4444"/>
  <text x="762.5" y="414" class="tick-label">Hybrid + Reranker</text>
  <rect x="692.9" y="140.3" width="42.4" height="249.7" rx="2" fill="#0284c7"/>
  <text x="714.1" y="136.3" class="val-label" fill="#0284c7">2496.6ms</text>
  <rect x="739.3" y="142.8" width="42.4" height="247.2" rx="2" fill="#10b981"/>
  <text x="760.5" y="138.8" class="val-label" fill="#10b981">2472.3ms</text>
  <rect x="785.7" y="104.0" width="42.4" height="286.0" rx="2" fill="#ef4444"/>
  <text x="806.9" y="100.0" class="val-label" fill="#ef4444">2859.6ms</text>
</svg>